<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spyglass</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./src/shell.css" />
  </head>
  <body data-theme="dark">
    <div class="app" id="app">
      <header class="toolbar" id="toolbar">
        <nav class="nav-controls" aria-label="Navigation">
          <button type="button" class="icon-btn" id="back" aria-label="Back" title="Back" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6 9 12l6 6" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="forward" aria-label="Forward" title="Forward" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 6 6 6-6 6" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="reload" aria-label="Reload" title="Reload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.3-5.7" />
              <path d="M20 5v5h-5" />
            </svg>
          </button>
        </nav>
        <form class="url-form" id="url-form">
          <label class="sr-only" for="url">Address</label>
          <input
            id="url"
            name="url"
            type="text"
            spellcheck="false"
            autocomplete="off"
            inputmode="url"
            placeholder="Enter a URL"
          />
        </form>
        <div class="toolbar-status">
          <span class="rec-pill" id="rec-pill" data-active="false" title="Recording idle">REC</span>
        </div>
      </header>
      <div class="workspace" id="workspace">
        <div class="browser-slot" id="browser-slot"></div>
        <button
          type="button"
          class="gutter"
          id="gutter"
          aria-label="Resize browser and chat"
        ></button>
        <aside class="chat" id="chat" aria-label="Chat placeholder">
          <header class="chat-header">
            <div class="mark" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
                <title>Spyglass</title>
                <circle cx="32" cy="32" r="21" />
                <path d="M32 11 47 28" />
                <path d="M32 11 47 28" transform="rotate(60 32 32)" />
                <path d="M32 11 47 28" transform="rotate(120 32 32)" />
                <path d="M32 11 47 28" transform="rotate(180 32 32)" />
                <path d="M32 11 47 28" transform="rotate(240 32 32)" />
                <path d="M32 11 47 28" transform="rotate(300 32 32)" />
              </svg>
            </div>
            <div>
              <h1>Spyglass</h1>
              <p class="tagline">Lot 1 — capture</p>
            </div>
          </header>
          <p class="chat-copy">
            Record a path in the guest page. Each capture step is appended to
            <code>raw.jsonl</code>. Replay uses Stagehand <code>act()</code> with no LLM.
          </p>
          <p class="meta" id="versions">Loading…</p>
          <p class="cdp" id="cdp-status">CDP: waiting…</p>
          <button type="button" class="observe-btn" id="observe">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="M15.8 15.8 21 21" />
            </svg>
            Observe page
          </button>
          <ol class="log" id="log" aria-live="polite"></ol>
          <div class="composer">
            <button type="button" class="record-btn" id="record-btn" data-state="idle">
              Record
            </button>
            <button type="button" class="observe-btn" id="replay-act">Replay capture (no LLM)</button>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
