appId: dev.spyglass.app
productName: Spyglass
executableName: spyglass
copyright: Copyright © Spyglass contributors
# Internal v1 (PRD §2.3 / §16.3): unsigned and not notarized.
# Signing hooks are left in place so certificates can be added later without
# restructuring targets. Do not set CSC_IDENTITY_AUTO_DISCOVERY=true until certs exist.
forceCodeSigning: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - from: scripts
    to: scripts
    filter:
      - stagehand-observe.mjs
      - stagehand-act.mjs
      - cdp-guest.mjs
# D1: unpack Stagehand runtime so packaged Observe can import from disk
# (ELECTRON_RUN_AS_NODE spawn of extraResources/scripts/stagehand-observe.mjs).
asarUnpack:
  - scripts/stagehand-observe.mjs
  - scripts/stagehand-act.mjs
  - scripts/cdp-guest.mjs
  - node_modules/**
extraResources:
  - from: scripts/stagehand-observe.mjs
    to: scripts/stagehand-observe.mjs
  - from: scripts/stagehand-act.mjs
    to: scripts/stagehand-act.mjs
  - from: scripts/cdp-guest.mjs
    to: scripts/cdp-guest.mjs
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - dir
  category: Development
  icon: build/icon.png
  synopsis: Spyglass — AI-assisted web scenario recorder (internal v1, unsigned)
  description: Spyglass Lot 1 capture — DOM probe, raw.jsonl, Stagehand act() without LLM.
  maintainer: Spyglass contributors <tiamat.azure@gmail.com>
mac:
  # identity: null disables signing. Replace with a Developer ID later.
  identity: null
  notarize: false
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
win:
  # signAndEditExecutable: false keeps NSIS unsigned. Add certificateFile later.
  signAndEditExecutable: false
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  unicode: true
